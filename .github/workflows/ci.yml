name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-hygiene:
    name: Repository hygiene (artifacts, secrets, and file size)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked repository contents
        run: bash scripts/check-repository-hygiene.sh
      - name: Check license metadata and notices
        run: bash scripts/check-licensing.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  style-guard:
    name: Style guard (color literals funnel through tokens)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check color literals live in the design tokens / palette
        run: bash scripts/check-style-tokens.sh

  orchestrator-tests:
    name: Orchestrator tests + typecheck
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/orchestrator/package-lock.json
      - name: Install dependencies
        working-directory: desktop/orchestrator
        run: npm ci
      - name: Run tests
        working-directory: desktop/orchestrator
        run: npm test
      - name: Typecheck
        working-directory: desktop/orchestrator
        run: npm run typecheck

  backend-tests:
    name: Managed backend tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run tests
        working-directory: backend
        run: npm test
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

  chat-ui-tests:
    name: Chat UI tests + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/chat-ui/package-lock.json
      - name: Install dependencies
        working-directory: desktop/chat-ui
        run: npm ci
      - name: Run tests
        working-directory: desktop/chat-ui
        run: npm test
      - name: Typecheck
        working-directory: desktop/chat-ui
        run: npm run typecheck
      - name: Build embedded WebView assets
        run: scripts/build-chat-ui.sh
      - name: Verify embedded WebView assets are current
        run: git diff --exit-code -- desktop/macos/chat-ui

  macos-tests:
    name: macOS hostless tests
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/chat-ui/package-lock.json
      - name: Install chat UI dependencies used by the Xcode build phase
        working-directory: desktop/chat-ui
        run: npm ci
      - name: Run native unit tests
        run: >-
          xcodebuild test
          -project verso.xcodeproj
          -scheme verso
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/verso-derived-data"
          CODE_SIGNING_ALLOWED=NO
      - name: Verify source and managed runtime profiles
        run: scripts/check-runtime-profiles.sh

  # Boots Hermes at the pinned ref with all Verso runtime patches applied and
  # runs the shared assertions from scripts/lib/smoke-gateway-checks.sh — the
  # same checks scripts/smoke-test-hermes-bundle.sh runs against the macOS
  # bundle, minus the bundled interpreter. Catches the failure class of 1.0.15:
  # a regenerated patch that applies cleanly and byte-compiles but lands on
  # the wrong call site and crashes every chat request at runtime.
  hermes-runtime-smoke:
    name: Hermes runtime smoke (patched gateway boots + streams)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read shared Hermes runtime configuration
        id: pin
        run: |
          source scripts/runtime-config.sh
          printf 'ref=%s\n' "$HERMES_REF" >> "$GITHUB_OUTPUT"
          printf 'repo=%s\n' "$HERMES_REPO" >> "$GITHUB_OUTPUT"
          printf 'extras=%s\n' "$HERMES_EXTRAS" >> "$GITHUB_OUTPUT"
          printf 'pins=%s\n' "${HERMES_EXTRA_PINS[*]}" >> "$GITHUB_OUTPUT"
          echo "pinned: ${HERMES_REPO} @ ${HERMES_REF} extras=[${HERMES_EXTRAS}] pins=[${HERMES_EXTRA_PINS[*]}]"

      - name: Fetch Hermes at pinned ref
        run: |
          mkdir hermes-src && cd hermes-src
          git init -q
          git remote add origin "${{ steps.pin.outputs.repo }}"
          git fetch -q --depth 1 origin "${{ steps.pin.outputs.ref }}"
          git checkout -q FETCH_HEAD

      - name: Apply Verso runtime patches (build order)
        run: scripts/apply-hermes-patches.sh hermes-src

      - name: Install patched Hermes
        run: |
          pip install -q "./hermes-src[${{ steps.pin.outputs.extras }}]" ${{ steps.pin.outputs.pins }}
          hermes --version || true

      - name: Boot gateway and run the shared smoke assertions
        run: |
          set -euo pipefail
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          mkdir -p "$HERMES_HOME/memories"
          cp hermes-src/cli-config.yaml.example "$HERMES_HOME/config.yaml"
          export API_SERVER_ENABLED=true API_SERVER_HOST=127.0.0.1 API_SERVER_PORT=18977
          export API_SERVER_KEY="$(openssl rand -hex 32)"
          export PYTHONUNBUFFERED=1

          hermes gateway run > "$RUNNER_TEMP/gateway.log" 2>&1 &
          GW=$!
          trap 'kill "$GW" 2>/dev/null || true' EXIT

          source scripts/lib/smoke-gateway-checks.sh
          SMOKE_PORT=18977 SMOKE_API_KEY="$API_SERVER_KEY" SMOKE_PID="$GW"
          SMOKE_LOG="$RUNNER_TEMP/gateway.log" SMOKE_HOME="$HERMES_HOME" SMOKE_TMP="$RUNNER_TEMP"
          smoke_wait_for_gateway 120
          smoke_assert_streaming_responses "ci-smoke-1"
          smoke_assert_mcp_oauth_routes
